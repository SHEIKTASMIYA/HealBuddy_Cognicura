<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" fill="none">
  <defs>
    <linearGradient id="heartGradFull" x1="60" y1="20" x2="260" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="leafGradFull" x1="200" y1="10" x2="260" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Heart Base Outline -->
  <path d="M 160,162 C 110,128 88,96 88,66 C 88,41 106,26 130,26 C 145,26 154,33 160,41 C 166,33 175,26 190,26 C 203,26 213,31 220,40" 
        stroke="url(#heartGradFull)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ECG Pulse Waveform -->
  <path d="M 82,98 L 130,98 L 140,70 L 152,120 L 165,84 L 174,98 L 234,98" 
        stroke="#0F766E" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Lower Heart Right Curve -->
  <path d="M 160,162 C 192,140 216,116 222,98" 
        stroke="url(#heartGradFull)" stroke-width="11" stroke-linecap="round"/>

  <!-- Sprouting Twin Leaves -->
  <path d="M 205,48 C 205,26 223,16 236,18 C 236,32 221,48 205,48 Z" fill="url(#leafGradFull)"/>
  <path d="M 194,39 C 190,23 201,14 213,16 C 213,28 203,39 194,39 Z" fill="#34D399"/>

  <!-- HealBuddy Typography -->
  <text x="160" y="225" font-family="'Space Grotesk', 'Inter', sans-serif" font-size="34" font-weight="700" fill="#0F2942" text-anchor="middle" letter-spacing="-0.5">HealBuddy</text>
</svg>
